<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nama Bisnis Anda - Verifikasi</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f7;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background-color: #ffffff;
            padding: 2rem 1rem;
            text-align: center;
            border-bottom: 1px solid #e1e4e8;
        }
        h1 {
            margin: 0;
            font-size: 1.5rem;
            color: #1a1a1a;
        }
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }
        .container {
            max-width: 600px;
            background-color: #ffffff;
            padding: 2.5rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            text-align: center;
        }
        .description {
            font-size: 1.125rem;
            line-height: 1.6;
            margin-bottom: 1.5rem;
        }
        .status {
            display: inline-block;
            background-color: #e8f5e9;
            color: #2e7d32;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-weight: 500;
            font-size: 0.875rem;
            margin-bottom: 2rem;
        }
        .contact {
            padding-top: 1.5rem;
            border-top: 1px solid #f0f0f0;
        }
        .contact p {
            margin: 0.5rem 0;
            font-size: 0.9375rem;
            color: #666;
        }
        .contact a {
            color: #0066cc;
            text-decoration: none;
        }
        footer {
            padding: 1.5rem;
            text-align: center;
            font-size: 0.8125rem;
            color: #999;
            background-color: #f4f4f7;
        }
        @media (max-width: 480px) {
            .container {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Nama Bisnis Anda</h1>
    </header>
    <main>
        <div class="container">
            <p class="description">
                Platform e-commerce yang saat ini sedang dalam tahap pengembangan.
            </p>
            <div class="status">
                Website sedang dalam pengembangan dan belum menerima transaksi publik.
            </div>
            <div class="contact">
                <p>Informasi Kontak:</p>
                <p>Email: <a href="mailto:kontak@namabisnis.com">kontak@namabisnis.com</a></p>
            </div>
        </div>
    </main>
    <footer>
        <p>© 2025 Nama Bisnis Anda</p>
    </footer>
</body>
</html>
